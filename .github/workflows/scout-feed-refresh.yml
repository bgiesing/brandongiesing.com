name: Scout Ambient feed refresh
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate Scout feed
        run: python3 scout-ambient/producer/scout_feed_producer.py --out scout-ambient/scout-feed.json
      - name: Commit if changed
        run: |
          git config user.name "scout-ambient-bot"
          git config user.email "scout-ambient-bot@users.noreply.github.com"
          git add scout-ambient/scout-feed.json
          git diff --cached --quiet || git commit -m "Refresh Scout Ambient feed"
          git push
